<!doctype html>
<html lang="en">
    <head>
        <title>Travlog</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="shortcut icon"
            href="/assets/images/logo.png"
            type="image/x-icon"
        />
        <link rel="stylesheet" href="src/styles/main.scss" />
    </head>

    <body>
        <header class="navbar container">
            <nav class="nav">
                <div class="nav__brand">
                    <a href="#" class="nav__logo-link">
                        <img
                            src="/assets/images/logo.webp"
                            alt="logo-img"
                            class="nav__logo"
                        />
                    </a>
                    <button
                        class="nav__hamburger"
                        type="button"
                        aria-label="Open menu"
                    >
                        <i class="icon icon-menubar"></i>
                    </button>
                </div>

                <div class="nav__links">
                    <ul class="nav__ul">
                        <li><a class="nav__link active" href="#">home</a></li>
                        <li><a class="nav__link" href="#">discover</a></li>
                        <li><a class="nav__link" href="#">special deals</a></li>
                        <li><a class="nav__link" href="#">contact</a></li>
                    </ul>
                </div>

                <div class="nav__buttons">
                    <button
                        class="btn btn--secondary login"
                        aria-label="Login Button"
                    >
                        log in
                    </button>
                    <button
                        class="btn btn--primary signup"
                        aria-label="Signup Button"
                    >
                        sign up
                    </button>
                </div>

                <div class="nav__drawer">
                    <div class="nav__drawer-links">
                        <ul class="nav__drawer-ul">
                            <li>
                                <a class="nav__link active" href="#">home</a>
                            </li>
                            <li><a class="nav__link" href="#">discover</a></li>
                            <li>
                                <a class="nav__link" href="#">special deals</a>
                            </li>
                            <li><a class="nav__link" href="#">contact</a></li>
                        </ul>
                    </div>

                    <div class="nav__drawer-buttons">
                        <button class="btn btn--secondary login">log in</button>
                        <button class="btn btn--primary signup">sign up</button>
                    </div>
                </div>

                <div class="nav__drawer">
                    <div class="nav__drawer-links">
                        <ul>
                            <li>
                                <a class="active nav-links" href="#">home</a>
                            </li>
                            <li><a class="nav-links" href="#">discover</a></li>
                            <li>
                                <a class="nav-links" href="#">special deals</a>
                            </li>
                            <li><a class="nav-links" href="#">contact</a></li>
                        </ul>
                    </div>

                    <div class="nav__drawer-buttons">
                        <button class="btn btn--secondary login">log in</button>
                        <button class="btn btn--primary signup">sign up</button>
                    </div>
                </div>
            </nav>
        </header>
        <div class="bg-orange"></div>
        <main class="container hero">
            <section class="hero__visuals">
                <div class="hero__visuals__bg">
                    <img
                        src="/assets/images/background-globe.png"
                        alt="Background Globe"
                    />
                </div>
                <div class="hero__visuals__images">
                    <div class="hero__visuals__images--column">
                        <img src="/assets/images/layout-1.png" alt="Layout 1" />
                        <img src="/assets/images/layout-2.png" alt="Layout 2" />
                    </div>
                    <div class="hero__visuals__images--single">
                        <img src="/assets/images/layout-3.png" alt="Layout 3" />
                    </div>
                </div>
            </section>
            <section class="hero__content">
                <div class="hero__content__explore">
                    Explore the world!
                    <svg
                        width="20"
                        height="20"
                        viewBox="0 0 20 20"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <path
                            fill-rule="evenodd"
                            clip-rule="evenodd"

                            fill="#F85E9F"
                        />
                    </svg>
                </div>

                <div class="hero__content__texts">
                    <h1 class="h1">
                        Travel
                        <span class="hero__content__texts--secondary"
                            >top destination</span
                        >
                        of the world
                    </h1>
                    <p class="p">
                        We always make our customer happy by providing
                        <span class="break">as many choices as possible</span>
                    </p>
                </div>

                <div class="hero__content__btns">
                    <button
                        class="btn btn--primary content__btn content__btn--first"
                    >
                        Get Started
                    </button>
                    <button
                        class="btn btn--secondary content__btn content__btn--second"
                    >
                        <svg
                            width="20"
                            height="20"
                            viewBox="0 0 20 20"
                            fill="none"
                            xmlns="http://www.w3.org/2000/svg"
                        >
                            <path
                                d="M10 0C4.48 0 0 4.48 0 10C0 15.52 4.48 20 10 20C15.5201 20 20 15.52 20 10C20 4.48 15.5301 0 10 0ZM13 12.23L10.0999 13.9C9.73995 14.11 9.34005 14.21 8.94995 14.21C8.55005 14.21 8.15995 14.11 7.8 13.9C7.08 13.48 6.65 12.74 6.65 11.9V8.55C6.65 7.72 7.08 6.97 7.8 6.55C8.52005 6.13 9.37995 6.13 10.11 6.55L13.0099 8.22C13.7299 8.64 14.16 9.38 14.16 10.22C14.16 11.06 13.7299 11.81 13 12.23Z"
                                fill="#5D50C6"
                            />
                        </svg>
                        Watch Demo
                    </button>
                </div>
            </section>
        </main>
        <script type="module" src="./src/script/index.js"></script>
    </body>
</html>
